{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login | PMC Vehicle Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">

    <link rel="stylesheet" href="{% static 'myapp/css/styles.css' %}">
    <link rel="stylesheet" href="{% static 'myapp/css/login-register.css' %}">
</head>
<body class="centered bg-blue">
    <div class="card p-4 login-card" style="width: 500px;">

        <div class="logo-container mb-3">
            <img src="{% static 'myapp/images/logo.png' %}" alt="PMC Vehicle Management System" width="128" style="margin: 0 auto;">
            <h1 class="text-center text-color-blue mt-3">Vehicle Management System</h1>
        </div>

        <form method="POST">
            {% csrf_token %}

            {% if messages %}
                {% for message in messages %}
                    <div class="alert alert-danger">{{ message }}</div>
                {% endfor %}
            {% endif %}

            <div class="mb-3">
                <label for="username" class="form-label font-weight-bold">Employee ID</label>
                <div class="input-group">
                    <input type="text" name="username" id="username" class="form-control" placeholder="Enter Employee ID" required>
                </div>
            </div>
            <div class="mb-3">
                <label for="password" class="form-label font-weight-bold">Password</label>
                <div class="input-group">
                    <input type="password" name="password" id="password" class="form-control" placeholder="Enter Password" required>
                </div>
            </div>

            <button type="submit" class="btn btn-primary w-100 btn-blue font-weight-bold">Log in</button>

            <div style="text-align: right; padding-top: 18px;">
                <a href="#" class="text-color-blue" style="font-size: 12px;">Forgot Password?</a>
            </div>
        </form>
        <!-- <p class="text-center">
            Don't have an account? <a href="{% url 'register' %}">Register here</a>.
        </p> -->
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.js"></script>
</body>
</html>
