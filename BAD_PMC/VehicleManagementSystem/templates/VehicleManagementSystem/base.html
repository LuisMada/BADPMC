{% load static %}

<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Dashboard{% endblock %} PMC Vehicle Management System</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons/font/bootstrap-icons.css">

    <link rel="stylesheet" href="{% static 'myapp/css/styles.css' %}">

    {% block extra_styles %}{% endblock %}
</head>
<body>
    <nav class="navbar navbar-dark pmc-navbar px-3">
        <a class="navbar-brand" href="#">PMC</a>

        <ul class="navbar-nav ms-auto">
            <li class="nav-item">
                <a class="nav-link" href="{% url 'logout' %}">Logout&nbsp;&nbsp;<i class="bi bi-box-arrow-right"></i></a>
            </li>
        </ul>
    </nav>

    <!-- Main Content -->
    <div class="container-fluid mt-4" style="padding: 0 20px;">
        {% block content %}{% endblock %}
    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
